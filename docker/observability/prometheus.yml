# Prometheus for docker compose (profile: observability): the API, the workers (all pool processes,
# port 9100) and the collector. Alerts (alerts.yml) appear under Status > Alerts; no Alertmanager
# is wired up locally. Grafana provisions the MedLens dashboard (scripts/make_dashboard.py).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

;; PgBouncer for docker compose. Transaction pooling: a server connection is held only for the
;; length of a transaction, so the app must not rely on session state (prepared statements,
;; SET without LOCAL, advisory locks). See CLAUDE.md §7 and db/session.py.
;;
;; userlist.txt is generated at startup by the image entrypoint from DB_USER / DB_PASSWORD.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
server_idle_timeout = 600

;; Sent by some drivers (psycopg, JDBC) at connect time; harmless to drop.
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0

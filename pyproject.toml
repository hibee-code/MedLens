[project]
name = "medlens"
version = "0.1.0"
description = "MedLens: counterfeit-medicine verification backend for Nigeria"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "anthropic>=1.0.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "psycopg[binary]>=3.3.7",
    "purgatory>=3.0.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pyotp>=2.10.0",
    "pypdf>=6.0.0",
    "python-magic>=0.4.27",
    # Security floor 0.0.18 (CVE-2024-53981, multipart DoS); never declare anything lower.
    "python-multipart>=0.0.33",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers[redis]>=4.15.0",
]
# Image analysis (quality gate, perceptual hash, barcodes): small, so installed for development
# and in the worker image, never in the API image.
vision = [
    "imagehash>=4.3.2",
    # <5: paddlex (ocr-benchmark group) is built and tested against OpenCV 4.x.
    "opencv-python-headless>=4.10,<5",
    "pytesseract>=0.3.13",
    "zxing-cpp>=3.1.1",
]
# Embedding models and model-based scoring: large, worker image only (`make install-ml`).
ml = [
    "lightgbm>=4.7.0",
    "onnxruntime>=1.31.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=5.1.0",
    "torch>=2.8.0",  # CPU build, from the pytorch-cpu index below
]
# OCR engine candidate, blocked until the OCR benchmark (CLAUDE.md decision log).
ocr-benchmark = [
    "paddleocr>=3.7.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "vision"]
# paddlex pins opencv-contrib-python, which installs the same `cv2` module as
# opencv-python-headless (and needs libGL). Never install it; headless provides cv2.
override-dependencies = ["opencv-contrib-python>4.10.0.84; sys_platform == 'never'"]

# CPU-only torch: the default wheels bundle CUDA (several GB) that the worker never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "BLE", "A", "C4", "DTZ", "T20", "PT", "RET",
    "SIM", "TID", "ARG", "PTH", "ERA", "RUF", "ASYNC", "FAST", "LOG", "G", "PIE", "PLE", "PLW",
]
ignore = [
    "N818", # domain exceptions are named after the condition (NotFound, Conflict, ...)
    "FAST001", # convention: every route declares response_model explicitly (Phase 1)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ARG001", "ARG002", "ARG005"]
"migrations/**" = [
    "ERA001",
    "S608", # DDL built from constants: identifiers cannot be bound parameters
]

[tool.ruff.lint.isort]
known-first-party = ["medlens", "migrations", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool", "ignore-without-code"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No inline types or stubs in the allowed dependency list.
module = ["celery.*", "aioboto3.*", "boto3.*", "botocore.*", "pytesseract.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as tests.<...>
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "integration: needs Docker; starts real services with testcontainers",
    "e2e: runs against a full docker compose stack",
]

[tool.coverage.run]
source = ["medlens"]
branch = true
# SQLAlchemy's async layer runs code in greenlets; without this, coverage loses track of it.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.$"]

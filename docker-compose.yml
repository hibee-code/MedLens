# MedLens local stack.
#
#   docker compose up -d --wait                           # core services
#   docker compose --profile observability up -d --wait   # + otel-collector, jaeger, prometheus, grafana
#
# Configuration comes from .env (create it with `make dev-secrets`; documented in .env.example).
# Credentials have no fallbacks here: compose refuses to start until .env provides them. Host ports
# bind to 127.0.0.1 only. Containers reach each other by service name, so the app's MEDLENS_* host
# settings are overridden below.

name: medlens

x-app-environment: &app-environment
  MEDLENS_APP__ENVIRONMENT: ${MEDLENS_APP__ENVIRONMENT:?run make dev-secrets}
  MEDLENS_DATABASE__HOST: pgbouncer
  MEDLENS_DATABASE__PORT: "5432"
  MEDLENS_DATABASE__PGBOUNCER: "true"
  MEDLENS_REDIS__HOST: redis
  MEDLENS_REDIS__PORT: "6379"
  MEDLENS_S3__ENDPOINT_URL: http://minio:9000

x-app: &app
  env_file:
    - path: .env
      required: false
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

# MinIO stopped publishing container images in October 2025; Chainguard builds them from source.
# Its free tier only offers `latest`, so the image is pinned by digest.
x-minio-image: &minio-image cgr.dev/chainguard/minio:latest@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d

services:
  # ---------------------------------------------------------------------------- application
  api:
    <<: *app
    build:
      context: .
      target: api
    image: medlens-api:local
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"

  worker:
    <<: *app
    build:
      context: .
      target: worker
    image: medlens-worker:local

  beat:
    <<: *app
    build:
      context: .
      target: api
    image: medlens-api:local
    command:
      - celery
      - -A
      - medlens.queue.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true # the api image's HTTP healthcheck does not apply; Phase 10 adds a heartbeat

  flower:
    image: mher/flower:2.0.1
    environment:
      CELERY_BROKER_URL: redis://redis:6379/${MEDLENS_REDIS__BROKER_DB:-1}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?run make dev-secrets}
    ports:
      - "127.0.0.1:${FLOWER_HOST_PORT:-5555}:5555" # never expose publicly
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------- data stores
  postgres:
    build: docker/postgres
    image: medlens-postgres:17
    environment:
      POSTGRES_USER: ${MEDLENS_DATABASE__USER:?run make dev-secrets}
      POSTGRES_PASSWORD: ${MEDLENS_DATABASE__PASSWORD:?run make dev-secrets}
      POSTGRES_DB: ${MEDLENS_DATABASE__NAME:?run make dev-secrets}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432" # direct access, e.g. for migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_USER: ${MEDLENS_DATABASE__USER:?run make dev-secrets}
      DB_PASSWORD: ${MEDLENS_DATABASE__PASSWORD:?run make dev-secrets}
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    # AOF on: the Celery broker lives here and queued tasks must survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MEDLENS_S3__ACCESS_KEY_ID:?run make dev-secrets}
      MINIO_ROOT_PASSWORD: ${MEDLENS_S3__SECRET_ACCESS_KEY:?run make dev-secrets}
      MC_CONFIG_DIR: /tmp/.mc
      MC_HOST_local: http://${MEDLENS_S3__ACCESS_KEY_ID:?run make dev-secrets}:${MEDLENS_S3__SECRET_ACCESS_KEY:?run make dev-secrets}@localhost:9000
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      # Healthy = server up and bucket present. The first passing check creates the bucket, so no
      # separate init container is needed (one-shot containers also break `up --wait`).
      test: ["CMD", "mc", "mb", "--ignore-existing", "local/${MEDLENS_S3__BUCKET:?run make dev-secrets}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------- observability
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.12
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make dev-secrets}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
